<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>演讲者视图 · Lucy AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1117;--card:#161A22;--ink:#EEF0F5;--mut:rgba(238,240,245,.68);--faint:rgba(238,240,245,.42);--acc:#8EA4FF;--blue:#2B50E0;--hair:rgba(255,255,255,.1);--fs:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--hair);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;color:var(--mut)}
.top .pos{color:var(--ink);font-weight:600;font-size:15px}
.top .ch{color:var(--acc)}
.top .sp{flex:1}
.top .link{display:flex;align-items:center;gap:8px}
.top .link i{width:8px;height:8px;border-radius:50%;background:#E5484D}
.top .link.on i{background:#3DD68C}
.timer{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:4px 12px}
.timer.over{color:#FF8A65}
.tb{border:1px solid var(--hair);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12px}
.bar{height:3px;background:var(--hair)}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
main{overflow:auto;padding:34px 40px 30px;display:flex;flex-direction:column;gap:22px}
.title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:calc(var(--fs) * 1.45);line-height:1.2;letter-spacing:-.01em}
.title small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--acc);margin-bottom:10px}
.script{font-size:var(--fs);line-height:1.75;color:var(--ink);max-width:40em}
.script p+p{margin-top:.7em}
.cues{display:flex;flex-wrap:wrap;gap:10px}
.cues span{font-family:'IBM Plex Mono',monospace;font-size:calc(var(--fs) * .55);background:rgba(43,80,224,.22);border:1px solid rgba(142,164,255,.35);color:#C9D4FF;border-radius:999px;padding:6px 14px}
.dur{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint)}
.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:14px 22px;border-top:1px solid var(--hair);background:#0B0D12}
.nav{border:1px solid var(--hair);background:var(--card);border-radius:12px;padding:12px 20px;font-size:15px;min-width:110px}
.nav.next{background:var(--blue);border-color:var(--blue);color:#fff}
.next-up{font-size:15px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.next-up b{color:var(--ink);font-weight:700;margin-right:8px}
.next-up small{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--faint);margin-right:10px}
.help{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9}
.help.show{display:flex}
.help div{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:28px 32px;font-size:15px;line-height:2.1;max-width:560px}
.help b{font-family:'IBM Plex Mono',monospace;color:var(--acc);display:inline-block;min-width:120px}
.empty{color:var(--mut);font-size:18px;line-height:1.9}
</style>
</head>
<body>
<div>
  <div class="top">
    <span class="pos" id="pos">— / —</span>
    <span class="ch" id="ch">等待方案页连接</span>
    <span class="sp"></span>
    <span class="link" id="link"><i></i><span id="linkTxt">未连接</span></span>
    <span id="clock"></span>
    <span class="timer" id="timer" title="点击开始 / 暂停，双击归零">00:00</span>
    <button class="tb" id="fsDown" title="字号减小">A−</button>
    <button class="tb" id="fsUp" title="字号增大">A+</button>
    <button class="tb" id="helpBtn">?</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>
<main id="main">
  <div class="empty">在方案页按 <b>P</b> 打开本窗口即可自动同步；如果是手动打开的，请先在同一个浏览器里打开方案页。<br>会议里只共享方案页所在的窗口，这个窗口不会被对方看到。</div>
</main>
<div class="bottom">
  <button class="nav" id="prev">← 上一屏</button>
  <div class="next-up" id="nextUp"></div>
  <button class="nav next" id="next">下一屏 →</button>
</div>
<div class="help" id="help"><div>
  <b>→ / 空格 / PgDn</b>下一屏（方案页同步滚动）<br>
  <b>← / PgUp</b>上一屏<br>
  <b>T</b>开始 / 暂停计时，双击计时器归零<br>
  <b>+ / −</b>调整讲稿字号<br>
  <b>F</b>跟随模式：方案页滚到哪，讲稿跟到哪（默认开启）<br>
  <span style="color:var(--mut)">翻页笔一般发送 PgUp / PgDn，焦点在本窗口时可直接用。</span>
</div></div>
<script type="module">
import { NOTES } from './assets/js/notes.js';
const $ = s => document.querySelector(s);
const ch = new BroadcastChannel('lucy-presenter');
let idx = -1, lastSeen = 0, follow = true, hold = 0;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function render(i) {
  if (i < 0 || i >= NOTES.length) return;
  idx = i;
  const n = NOTES[i], nx = NOTES[i + 1];
  $('#pos').textContent = String(i + 1).padStart(2, '0') + ' / ' + NOTES.length;
  $('#ch').textContent = n.ch;
  $('#bar').style.width = ((i + 1) / NOTES.length * 100) + '%';
  $('#main').innerHTML = `<div class="title"><small>${esc(n.ch)} · 约 ${n.sec} 秒</small>${esc(n.t)}</div>
    <div class="script">${n.s.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>
    ${n.cues.length ? `<div class="cues">${n.cues.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}`;
  $('#main').scrollTop = 0;
  $('#nextUp').innerHTML = nx ? `<small>NEXT</small><b>${esc(nx.t)}</b>${esc(nx.s.split('\n')[0])}` : '<small>NEXT</small><b>结束</b>';
  if (!timer.running && timer.t === 0 && i > 0) startTimer();
}
function go(i) { i = Math.max(0, Math.min(NOTES.length - 1, i)); hold = Date.now() + 2600; render(i); ch.postMessage({ type: 'goto', idx: i }); }

ch.onmessage = e => {
  const m = e.data || {};
  if (m.type === 'pos') { lastSeen = Date.now(); if (follow && m.idx !== idx && Date.now() > hold) render(m.idx); }
};
ch.postMessage({ type: 'hello' });
setInterval(() => {
  const on = Date.now() - lastSeen < 4000;
  $('#link').classList.toggle('on', on);
  $('#linkTxt').textContent = on ? (follow ? '已同步' : '已连接 · 手动') : '未连接';
  if (!on) ch.postMessage({ type: 'hello' });
}, 1500);

// timer
const timer = { t: 0, running: false, last: 0 };
function startTimer() { timer.running = true; timer.last = performance.now(); }
function tick(now) {
  if (timer.running) { timer.t += (now - timer.last) / 1000; timer.last = now; }
  const planned = NOTES.reduce((a, n) => a + n.sec, 0);
  const el = $('#timer'); el.textContent = fmt(timer.t); el.classList.toggle('over', timer.t > planned);
  const d = new Date(); $('#clock').textContent = d.toTimeString().slice(0, 5);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
$('#timer').onclick = () => { timer.running ? (timer.running = false) : startTimer(); };
$('#timer').ondblclick = () => { timer.t = 0; timer.running = false; };

// font size
let fs = 30; try { fs = +localStorage.getItem('lucy-presenter-fs') || 30; } catch (e) {}
const setFs = v => { fs = Math.max(18, Math.min(52, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('lucy-presenter-fs', fs); } catch (e) {} };
setFs(fs);
$('#fsUp').onclick = () => setFs(fs + 2); $('#fsDown').onclick = () => setFs(fs - 2);
$('#prev').onclick = () => go(idx - 1); $('#next').onclick = () => go(idx + 1);
$('#helpBtn').onclick = () => $('#help').classList.toggle('show');
$('#help').onclick = () => $('#help').classList.remove('show');
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === 't' || e.key === 'T') timer.running ? (timer.running = false) : startTimer();
  else if (e.key === '+' || e.key === '=') setFs(fs + 2);
  else if (e.key === '-') setFs(fs - 2);
  else if (e.key === 'f' || e.key === 'F') follow = !follow;
  else if (e.key === '?') $('#help').classList.toggle('show');
});
render(0);
</script>
</body>
</html>
